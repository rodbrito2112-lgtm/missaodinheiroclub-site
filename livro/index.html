<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O livro (em breve) | Missão Dinheiro Club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1E3D">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Nunito:wght@700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .breve{min-height:100svh;display:flex;align-items:center;padding:48px 0}
  .breve .faixa{display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:center}
  .breve img.capa{width:220px;height:auto;border-radius:8px;box-shadow:0 24px 40px rgba(0,0,0,.45);transform:rotate(-3deg)}
  .breve-txt{max-width:520px;display:flex;flex-direction:column;gap:16px}
  .breve-txt p{color:var(--texto2);font-size:18px}
  .breve-botoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
</style>
</head>
<body>
<main class="breve">
  <div class="faixa">
    <img class="capa" src="capa-ebook.webp" width="600" height="900" alt="Capa do livro O futuro financeiro do seu filho começa com você">
    <div class="breve-txt">
      <a href="../" class="logo-link"><img src="../assets/logo-main.webp" width="412" height="281" alt="Missão Dinheiro Club, página inicial" class="logo"></a>
      <h1 style="font-size:clamp(2rem,4vw,2.8rem)">O livro chega em breve.</h1>
      <p><em>O futuro financeiro do seu filho começa com você</em>, de Rodrigo Brito, é o livro do Missão Dinheiro Club para os pais. Vem com o jogo de cartas Missão Dinheiro: Pistas e o kit da família como bônus.</p>
      <p>Enquanto isso, a família já pode jogar de graça.</p>
      <div class="breve-botoes">
        <a href="https://rodbrito2112-lgtm.github.io/trilha-missao-dinheiro/" target="_blank" rel="noopener" class="btn">Jogar grátis</a>
        <a href="../" class="btn btn-fantasma">Voltar ao Club</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
